name: publish

# Builds and publishes a versioned image to GHCR. The server then deploys by
# pulling a pinned version — no rsync, no build-on-box, no source on the host.
#
# Deliberately NOT a moving tag: this service mints credentials, so a merge to
# main publishes an artifact but never changes what is running. Promoting a
# version is a separate, human act (see README "Deploy").

on:
  push:
    branches: [main]
    # Publish only when IMAGE CONTENT changed. Positively defined, because the
    # denylist this replaced was wrong twice in one day: it started as "not
    # markdown, not docs/", then needed '.github/**' when a workflow was added,
    # and would have needed 'test/**' the very next PR. Each miss fires a publish
    # for a version already in the registry, so the immutable-tag guard below
    # refuses and main goes red for a change that shipped no bytes.
    #
    # A denylist of non-image paths can never be finished — every new top-level
    # directory is another way to be wrong. This list is derivable instead: it is
    # exactly what the Dockerfile COPYs, plus the Dockerfile itself.
    # `test/dockerfileTriggerParity.test.js` fails if the two drift apart.
    #
    # Two consequences, both deliberate:
    #   - An edit to THIS file no longer triggers itself; a publish change is
    #     first exercised by the next real code push.
    #   - It fails CLOSED. A new COPY line without a matching entry here means no
    #     publish rather than a bad one — and the parity test turns that silence
    #     into a red build, which is the whole reason it exists.
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      # NOTE: docker-compose.yml is deliberately absent. It is DEPLOYMENT config —
      # bumping which version the box runs must not republish that version, which
      # already exists and is the whole point of pinning it. Under the old
      # paths-ignore it needed an explicit entry to say that; under an allowlist
      # it is excluded by construction, along with docs, tests, scripts and CI.
      # Left as a note because "the compose pin must not trigger a build" is a
      # real constraint that is now invisible in the list.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag must name exactly one image forever, or "pinned to 0.2.0"
      # stops meaning anything and rollback silently lands on the wrong build.
      # Overwriting is the default registry behaviour, so refuse explicitly:
      # merging without bumping the version is the mistake this catches.
      - name: Refuse to overwrite an existing version tag
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
        run: |
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump \"version\" in package.json." >&2
            exit 1
          fi
          echo "$TAG is unused — ok to publish."

      # The OCI host is aarch64 while the runner is amd64. A single-arch image
      # pulls fine here and fails on the box with "no matching manifest" — a
      # failure that building on the box used to hide entirely.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Both tags are immutable: the version is what compose pins, the sha
          # is what ties a running container back to a commit.
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assert the manifest actually carries the host's architecture. Dropping
      # the platforms line above would otherwise publish green and only fail
      # later, on the box, at pull time.
      - name: Verify the published manifest covers the deploy target
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
        run: |
          archs=$(docker manifest inspect "$TAG" | jq -r '.manifests[].platform.architecture')
          echo "$archs" | grep -qx arm64 || {
            echo "::error::$TAG has no arm64 manifest; the OCI host is aarch64" >&2; exit 1; }
          echo "arm64 present."

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.value }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Not yet deployed. To promote, pin this version in the box's"
            echo "\`docker-compose.yml\` and run \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
